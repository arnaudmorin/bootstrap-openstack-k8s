---
- name: Install
  hosts: localhost
  vars_files:
    - ../config/config.yaml
  tasks:

  - name: install some dependencies
    apt:
      name: ["tcpdump", "ifupdown", "lnav", "ccze", "tmux", "crudini"]
      update_cache: yes
      state: latest

  - name: grab neutron
    get_url:
      url: "https://github.com/arnaudmorin/openstack-debian/releases/latest/download/{{item}}"
      dest: "/root/{{item}}"
    with_items:
      - openstack-neutron_2025.1-28+3f10f5e_all.deb 

  - name: install neutron
    apt:
      deb: "/root/{{item}}"
    with_items:
      - openstack-neutron_2025.1-28+3f10f5e_all.deb 

  - name: "[workaround] disable ipv6"   # NOTE(arnaud) we cant use IPv6 for now, because we are all using the same flat vlan 0 network for public routing, and IPv6 is detecting duplicates IPs.
    ansible.posix.sysctl:
      name: net.ipv6.conf.all.disable_ipv6
      value: '1'

  - name: check ovs manager
    command: ovs-vsctl get-manager
    register: ovs_manager_output
    changed_when: false

  - name: create ovs manager
    command: ovs-vsctl set-manager ptcp:6640:127.0.0.1
    when: "'ptcp:6640:127.0.0.1' not in ovs_manager_output.stdout"

  # br-ex
  - name: check if br-ex exists
    command: ovs-vsctl br-exists br-ex
    register: ovs_br_ex_exists
    ignore_errors: true

  - name: create br-ex ovs bridge
    command: ovs-vsctl add-br br-ex
    when: ovs_br_ex_exists.rc == 2

  - name: check fail mode br-ex
    command: ovs-vsctl get-fail-mode br-ex
    register: ovs_br_ex_fail_mode

  - name: set fail mode to standalone on br-ex
    command: ovs-vsctl set-fail-mode br-ex standalone
    when: ovs_br_ex_fail_mode.stdout != 'standalone'

  - name: check physical port in br-ex
    command: ovs-vsctl port-to-br public
    register: ovs_br_ex_port
    ignore_errors: true

  - name: set physical port in br-ex
    command: ovs-vsctl add-port br-ex public
    when: ovs_br_ex_port.stdout != 'br-ex'

  - name: setting second interface up
    command: ip link set public up
    changed_when: false

  # br-octavia
  - name: check if br-octavia exists
    command: ovs-vsctl br-exists br-octavia
    register: ovs_br_octavia_exists
    ignore_errors: true

  - name: create br-octavia bridge
    command: ovs-vsctl add-br br-octavia
    when: ovs_br_octavia_exists.rc == 2

  - name: check fail mode br-octavia
    command: ovs-vsctl get-fail-mode br-octavia
    register: ovs_br_octavia_fail_mode

  - name: set fail mode to secure on br-octavia
    command: ovs-vsctl set-fail-mode br-octavia secure
    when: ovs_br_octavia_fail_mode.stdout != 'secure'

  - name: check physical port in br-octavia
    command: ovs-vsctl port-to-br octavia
    register: ovs_br_octavia_port
    ignore_errors: true

  - name: set physical port in br-octavia
    command: ovs-vsctl add-port br-octavia octavia
    when: ovs_br_octavia_port.stdout != 'br-octavia'

  - name: setting third interface up
    command: ip link set octavia up
    changed_when: false

  # br-flat
  - name: check if br-flat exists
    command: ovs-vsctl br-exists br-flat
    register: ovs_br_flat_exists
    ignore_errors: true

  - name: create br-flat bridge
    command: ovs-vsctl add-br br-flat
    when: ovs_br_flat_exists.rc == 2

  - name: check fail mode br-flat
    command: ovs-vsctl get-fail-mode br-flat
    register: ovs_br_flat_fail_mode

  - name: set fail mode to standalone on br-flat
    command: ovs-vsctl set-fail-mode br-flat standalone
    when: ovs_br_flat_fail_mode.stdout != 'standalone'

# NOTE(arnaud): this was used for ironic
# maybe later
#  - name: add third network card in br-flat
#    openvswitch_port:
#      bridge: br-flat
#      port: "{{ allNetworkInterfaces[2].device }}"
#      state: present
#    when: allNetworkInterfaces | length > 2


  - name: create systemd files
    copy:
      src: files/{{item}}
      dest: /etc/systemd/system/{{item}}
      mode: 0644
      owner: root
      group: root
    with_items:
      - neutron-dhcp-agent.service
      - neutron-openvswitch-agent.service
      - neutron-l3-agent.service
      - neutron-metadata-agent.service

  - name: create groups
    group:
      name: "{{item.name}}"
      gid: "{{item.id}}"
      state: present
    with_items:
      - { name: 'neutron', id: 201 }

  - name: create users
    user:
      name: "{{item.name}}"
      uid: "{{item.id}}"
      group: "{{item.name}}"
      home: "/var/lib/{{item.name}}/"
      system: true
      shell: /bin/bash
    with_items:
      - { name: 'neutron', id: 201 }

  - name: update perm on users home
    file:
      dest: "/var/lib/{{item}}"
      mode: "0755"
    with_items:
      - neutron
      
  - name: create log files with correct permissions
    file:
      path: "{{item.path}}"
      owner: "{{item.user}}"
      group: "{{item.user}}"
      state: touch
    with_items:
      - { path: '/var/log/neutron-dhcp-agent.log', user: 'neutron'}
      - { path: '/var/log/neutron-l3-agent.log', user: 'neutron'}
      - { path: '/var/log/neutron-metadata-agent.log', user: 'neutron'}
      - { path: '/var/log/neutron-openvswitch-agent.log', user: 'neutron'}

  - name: create neutron rootwrap config
    copy:
      src: "/opt/openstack/neutron/etc/neutron/{{item}}"
      dest: "/etc/neutron/"
    with_items:
      - rootwrap.conf
      - rootwrap.d

  - name: create openstack sudoers
    copy:
      src: files/openstack_sudoers
      dest: /etc/sudoers.d/openstack_sudoers

  - name: configure neutron
    ini_file:
      path: /etc/neutron/neutron.conf
      section: "{{item.section}}"
      option: "{{item.option}}"
      value: "{{item.value}}"
    with_items:
      - { section: "DEFAULT", option: "transport_url", value: "rabbit://openstack:{{password}}@{{domain}}:30672" }
      - { section: "DEFAULT", option: "auth_strategy", value: "keystone" }
      - { section: "oslo_concurrency", option: "lock_path", value: "/var/lib/neutron/tmp" }
      - { section: "keystone_authtoken", option: "www_authenticate_uri", value: "http://keystone.{{domain}}" }
      - { section: "keystone_authtoken", option: "auth_url", value: "http://keystone.{{domain}}" }
        #      - { section: "keystone_authtoken", option: "memcached_servers", value: "keystone:11211" }
      - { section: "keystone_authtoken", option: "auth_type", value: "password" }
      - { section: "keystone_authtoken", option: "project_domain_name", value: "Default" }
      - { section: "keystone_authtoken", option: "user_domain_name", value: "Default" }
      - { section: "keystone_authtoken", option: "project_name", value: "service" }
      - { section: "keystone_authtoken", option: "username", value: "neutron" }
      - { section: "keystone_authtoken", option: "password", value: "{{password}}" }
      - { section: "keystone_authtoken", option: "region_name", value: "RegionOne" }
      - { section: "agent", option: "root_helper", value: "sudo /opt/openstack/neutron/bin/neutron-rootwrap /etc/neutron/rootwrap.conf" }
    notify:
      - restart neutron
  - name: configure neutron l2 agent
    ini_file:
      path: /etc/neutron/plugins/ml2/openvswitch_agent.ini
      section: "{{item.section}}"
      option: "{{item.option}}"
      value: "{{item.value}}"
    with_items:
      - { section: "agent", option: "tunnel_types", value: "vxlan" }
      - { section: "agent", option: "l2_population", value: "true" }
      - { section: "agent", option: "arp_responder", value: "true" }
      - { section: "agent", option: "enable_distributed_routing", value: "true" }
      - { section: "ovs", option: "local_ip", value: "{{ansible_default_ipv4['address']}}" }
      - { section: "ovs", option: "bridge_mappings", value: "provider:br-ex,flat:br-flat,provider-octavia:br-octavia" }
      - { section: "securitygroup", option: "enable_security_group", value: "true" }
      - { section: "securitygroup", option: "firewall_driver", value: "openvswitch" }
    notify:
      - restart neutron
  - name: configure neutron l3 agent
    ini_file:
      path: /etc/neutron/l3_agent.ini
      section: "{{item.section}}"
      option: "{{item.option}}"
      value: "{{item.value}}"
    with_items:
      - { section: "DEFAULT", option: "interface_driver", value: "openvswitch" }
      - { section: "DEFAULT", option: "agent_mode", value: "dvr_snat" }
      - { section: "DEFAULT", option: "extensions", value: "port_forwarding" }
      - { section: "DEFAULT", option: "ha_vrrp_auth_password", value: "{{password}}" }
      - { section: "DEFAULT", option: "ha_vrrp_health_check_interval", value: "30" }
    notify:
      - restart neutron
  - name: configure neutron dhcp agent
    ini_file:
      path: /etc/neutron/dhcp_agent.ini
      section: "{{item.section}}"
      option: "{{item.option}}"
      value: "{{item.value}}"
    with_items:
      - { section: "DEFAULT", option: "interface_driver", value: "openvswitch" }
      - { section: "DEFAULT", option: "dhcp_driver", value: "neutron.agent.linux.dhcp.Dnsmasq" }
      - { section: "DEFAULT", option: "enable_isolated_metadata", value: "true" }
    notify:
      - restart neutron
  - name: configure neutron metadata agent
    ini_file:
      path: /etc/neutron/metadata_agent.ini
      section: "{{item.section}}"
      option: "{{item.option}}"
      value: "{{item.value}}"
    with_items:
      - { section: "DEFAULT", option: "nova_metadata_host", value: "nova.{{domain}}" }
      - { section: "DEFAULT", option: "nova_metadata_port", value: "30775" }
      - { section: "DEFAULT", option: "metadata_proxy_shared_secret", value: "{{password}}" }
    notify:
      - restart neutron

  - name: start services
    service:
      name: "{{item}}"
      state: started
      enabled: true
    with_items:
      - "neutron-dhcp-agent"
      - "neutron-metadata-agent"
      - "neutron-l3-agent"
      - "neutron-openvswitch-agent"

  - name: "[workaround] set guid /var/lib/neutron/external/pids/"   # NOTE(arnaud) neutron needs to have access to haproxy pid files (created by dhcp agents). By default, the pids were accessible to root only...
    file:
      path: /var/lib/neutron/external/pids/
      owner: neutron
      group: neutron
      mode: 'u=rwx,g=rx,o=x,g+s'
      state: directory

  handlers:
  - name: restart neutron
    service:
      name: "{{item}}"
      state: restarted
    with_items:
      - "neutron-dhcp-agent"
      - "neutron-metadata-agent"
      - "neutron-l3-agent"
      - "neutron-openvswitch-agent"
