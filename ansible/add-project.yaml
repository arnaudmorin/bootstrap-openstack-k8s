---
- name: Install
  hosts: localhost
  vars:
    user_password: "{{ lookup('password', '/dev/null length=15 chars=ascii_letters') }}"
  vars_files:
    - ../config/config.yaml
  tasks:
  - name: check if vars are given
    assert:
      that:
        - project_name is defined

  - name: create project
    os_project:
      name: "{{project_name}}"
      description: "project {{project_name}}"
      region_name: "RegionOne"
      domain_id: "default"

  - name: create user
    os_user:
      name: "{{project_name}}_user1"
      password: "{{user_password}}"
      default_project: "{{project_name}}"
      description: "user for {{project_name}}"
      region_name: "RegionOne"
      domain: "default"

  - name: add roles to user
    os_user_role:
      user: "{{project_name}}_user1"
      project: "{{project_name}}"
      role: "{{item}}"
    with_items:
      - member
      - user

  - name: "create openrc_{{ project_name }} file"
    vars:
      openrc_user: "{{project_name}}_user1"
      openrc_password: "{{user_password}}"
      openrc_project: "{{project_name}}"
      openrc_auth_url: "http://keystone.{{domain}}/v3"
    template:
      src: ./files/openrc.j2
      dest: "/root/openrc_{{ project_name }}"
